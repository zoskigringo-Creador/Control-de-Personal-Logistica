        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [darkMode, setDarkMode] = useState(false);
            const [currentView, setCurrentView] = useState('dashboard');
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            
            const [assignments, setAssignments] = useState(INITIAL_ASSIGNMENTS);
            const [truckStatus, setTruckStatus] = useState({}); 
            const [staff, setStaff] = useState(INITIAL_STAFF_DATA);
            const [absentStaffIds, setAbsentStaffIds] = useState(new Set());

            const [selectedSlot, setSelectedSlot] = useState(null); 
            const [showStaffModal, setShowStaffModal] = useState(false);
            const [showManageStaffModal, setShowManageStaffModal] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            
            const [newStaffData, setNewStaffData] = useState({ name: '', role: 'Ayudante', isDriver: false });
            const pdfLibraryLoaded = useRef(false);

            useEffect(() => {
                const timer = setTimeout(() => setShowSplash(false), 2500);

                const savedAssignments = localStorage.getItem('logistica_assignments');
                const savedStatus = localStorage.getItem('logistica_status');
                const savedDate = localStorage.getItem('logistica_date');
                const savedStaff = localStorage.getItem('logistica_staff');
                const savedAbsent = localStorage.getItem('logistica_absent');

                if (savedDate === date) {
                    if (savedAssignments) setAssignments(JSON.parse(savedAssignments));
                    if (savedStatus) setTruckStatus(JSON.parse(savedStatus));
                    if (savedAbsent) setAbsentStaffIds(new Set(JSON.parse(savedAbsent)));
                }
                if (savedStaff) {
                    setStaff(JSON.parse(savedStaff));
                }

                if (window.jspdf) {
                    pdfLibraryLoaded.current = true;
                }

                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                localStorage.setItem('logistica_assignments', JSON.stringify(assignments));
                localStorage.setItem('logistica_status', JSON.stringify(truckStatus));
                localStorage.setItem('logistica_date', date);
                localStorage.setItem('logistica_staff', JSON.stringify(staff));
                localStorage.setItem('logistica_absent', JSON.stringify(Array.from(absentStaffIds)));
            }, [assignments, truckStatus, date, staff, absentStaffIds]);

            const getStaffById = (id) => staff.find(s => s.id === id);

            const getAvailableStaff = () => {
                const assignedIds = new Set();
                Object.values(assignments).forEach(truck => {
                    if (truck.driver) assignedIds.add(truck.driver);
                    if (truck.helper1) assignedIds.add(truck.helper1);
                    if (truck.helper2) assignedIds.add(truck.helper2);
                });
                return staff.filter(s => !assignedIds.has(s.id) && !absentStaffIds.has(s.id));
            };
            
            const getAbsentStaff = () => {
                return staff.filter(s => absentStaffIds.has(s.id));
            };

            const handleAssign = (personId) => {
                if (!selectedSlot) return;
                const { truckId, slotType } = selectedSlot;

                const newAssignments = { ...assignments };
                if (personId) {
                    Object.keys(newAssignments).forEach(tId => {
                        if (newAssignments[tId]?.driver === personId) newAssignments[tId].driver = null;
                        if (newAssignments[tId]?.helper1 === personId) newAssignments[tId].helper1 = null;
                        if (newAssignments[tId]?.helper2 === personId) newAssignments[tId].helper2 = null;
                    });
                }

                if (!newAssignments[truckId]) {
                    newAssignments[truckId] = { driver: null, helper1: null, helper2: null, observation: "" };
                }
                newAssignments[truckId][slotType] = personId;
                
                setAssignments(newAssignments);
                setShowStaffModal(false);
                setSelectedSlot(null);
            };

            const toggleTruckStatus = (truckId) => {
                setTruckStatus(prev => ({
                    ...prev,
                    [truckId]: prev[truckId] === 'departed' ? 'pending' : 'departed'
                }));
            };

            const updateObservation = (truckId, text) => {
                const newAssignments = { ...assignments };
                if (!newAssignments[truckId]) {
                    newAssignments[truckId] = { driver: null, helper1: null, helper2: null, observation: "" };
                }
                newAssignments[truckId].observation = text;
                setAssignments(newAssignments);
            };

            const handleAddStaff = () => {
                if (!newStaffData.name.trim()) return;
                const newId = staff.length > 0 ? Math.max(...staff.map(s => s.id)) + 1 : 1;
                const newPerson = { ...newStaffData, id: newId, isFletero: false };
                setStaff([...staff, newPerson]);
                setNewStaffData({ name: '', role: 'Ayudante', isDriver: false }); 
            };
            
            const handleDeleteStaff = (id) => {
                if (window.confirm('¿Seguro que deseas eliminar a esta persona del sistema?')) {
                    // Remover de asignaciones actuales
                    const newAssignments = { ...assignments };
                    Object.keys(newAssignments).forEach(tId => {
                        if (newAssignments[tId]?.driver === id) newAssignments[tId].driver = null;
                        if (newAssignments[tId]?.helper1 === id) newAssignments[tId].helper1 = null;
                        if (newAssignments[tId]?.helper2 === id) newAssignments[tId].helper2 = null;
                    });
                    setAssignments(newAssignments);
                    
                    // Remover de ausentes
                    setAbsentStaffIds(prev => {
                        const newSet = new Set(prev);
                        newSet.delete(id);
                        return newSet;
                    });

                    // Remover de la lista
                    setStaff(prev => prev.filter(s => s.id !== id));
                }
            };

            const toggleDriverStatus = (id) => {
                setStaff(prevStaff => prevStaff.map(s => s.id === id ? { ...s, isDriver: !s.isDriver } : s));
            };

            const markAsAbsent = (id) => {
                if (!id) return;
                const newAssignments = { ...assignments };
                Object.keys(newAssignments).forEach(tId => {
                    if (newAssignments[tId]?.driver === id) newAssignments[tId].driver = null;
                    if (newAssignments[tId]?.helper1 === id) newAssignments[tId].helper1 = null;
                    if (newAssignments[tId]?.helper2 === id) newAssignments[tId].helper2 = null;
                });
                setAssignments(newAssignments);
                setAbsentStaffIds(prev => new Set(prev).add(id));
            };

            const markAsPresent = (id) => {
                setAbsentStaffIds(prev => {
                    const newSet = new Set(prev);
                    newSet.delete(id);
                    return newSet;
                });
            };

            const handleMarkCurrentSlotAbsent = () => {
                if(!selectedSlot) return;
                const { truckId, slotType } = selectedSlot;
                const currentPersonId = assignments[truckId]?.[slotType];
                
                if (currentPersonId) {
                    markAsAbsent(currentPersonId);
                }
                setShowStaffModal(false);
            };

            const exportPDF = () => {
                if (!pdfLibraryLoaded.current && !window.jspdf) {
                    alert("Las librerías PDF se están cargando. Intente de nuevo.");
                    return;
                }
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const margin = 14;
                let currentY = margin;

                doc.setFontSize(18);
                doc.text("Reporte Diario de Logística", margin, currentY);
                currentY += 10;
                doc.setFontSize(12);
                doc.text(`Fecha: ${date}`, margin, currentY);
                currentY += 15;

                const tableHeaders = [["Móvil", "Entregador/Chofer", "Ayudante 1", "Ayudante 2", "Observación"]];
                const getTableData = (truckIds) => {
                    return truckIds.map(truckId => {
                        const data = assignments[truckId] || {};
                        const driver = data.driver ? getStaffById(data.driver).name : "-";
                        const h1 = data.helper1 ? getStaffById(data.helper1).name : "-";
                        const h2 = data.helper2 ? getStaffById(data.helper2).name : "-";
                        const obs = data.observation || "";
                        return [truckId, driver, h1, h2, obs];
                    });
                };

                // PAGINA 1: CAMIONES EN RUTA
                const departedTrucks = INITIAL_TRUCKS.filter(id => truckStatus[id] === 'departed');
                doc.setFontSize(14);
                doc.setTextColor(0, 100, 0); 
                doc.text(`Camiones EN RUTA (${departedTrucks.length})`, margin, currentY);
                currentY += 5;

                if (departedTrucks.length > 0) {
                    doc.autoTable({
                        startY: currentY,
                        head: tableHeaders,
                        body: getTableData(departedTrucks),
                        theme: 'striped',
                        headStyles: { fillColor: [46, 125, 50] },
                        styles: { fontSize: 10 }
                    });
                } else {
                    doc.setFontSize(11);
                    doc.setTextColor(100);
                    doc.text("Ningún camión marcado 'En Ruta'.", margin, currentY + 5);
                }

                // NUEVA PAGINA PARA PENDIENTES
                doc.addPage();
                currentY = margin;

                // PAGINA 2: CAMIONES PENDIENTES
                const pendingTrucks = INITIAL_TRUCKS.filter(id => truckStatus[id] !== 'departed');
                doc.setFontSize(14);
                doc.setTextColor(150, 0, 0); 
                doc.text(`Camiones PENDIENTES / NO SALIERON (${pendingTrucks.length})`, margin, currentY);
                currentY += 5;

                if (pendingTrucks.length > 0) {
                    doc.autoTable({
                        startY: currentY,
                        head: tableHeaders,
                        body: getTableData(pendingTrucks),
                        theme: 'striped',
                        headStyles: { fillColor: [183, 28, 28] },
                        styles: { fontSize: 10 }
                    });
                } else {
                    doc.setFontSize(11);
                    doc.setTextColor(100);
                    doc.text("Todos los camiones están en ruta.", margin, currentY + 5);
                }

                // NUEVA PAGINA PARA AUSENTES (si hay espacio se puede dejar abajo, pero pediste "mas abajo", mejor otra hoja o bien separado)
                // Vamos a usar otra hoja para que sea limpio
                doc.addPage();
                currentY = margin;

                const absents = getAbsentStaff();
                doc.setFontSize(14);
                doc.setTextColor(0, 0, 0);
                doc.text(`Personal Marcado como AUSENTE (${absents.length})`, margin, currentY);
                currentY += 10;
                
                if (absents.length > 0) {
                    doc.setFontSize(10);
                    absents.forEach(p => {
                        doc.text(`• ${p.name} (${p.role}) ${p.isDriver ? '[CHOFER]' : ''}`, margin + 5, currentY);
                        currentY += 7;
                    });
                } else {
                    doc.setFontSize(11);
                    doc.setTextColor(100);
                    doc.text("No hay personal marcado como ausente.", margin + 5, currentY);
                }

                doc.save(`logistica_reporte_${date}.pdf`);
            };

            if (showSplash) {
                return (
                <div className="flex flex-col items-center justify-center h-screen bg-slate-900 text-white animate-fade-in">
                    <div className="relative mb-6">
                    <div className="absolute inset-0 bg-blue-500 blur-xl opacity-50 rounded-full"></div>
                    <Truck size={80} className="relative z-10 text-blue-400" />
                    </div>
                    <h1 className="text-4xl font-bold tracking-widest mb-2">LOGISTICA</h1>
                    <p className="text-slate-400 text-sm">Sistema de Control de Personal</p>
                    <p className="absolute bottom-10 text-xs text-slate-600">Versión 2.2.0 - Rodrigo Cabrera</p>
                </div>
                );
            }

            return (
                <div className={`min-h-screen transition-colors duration-300 ${darkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-100 text-slate-800'}`}>
                
                <header className={`sticky top-0 z-40 backdrop-blur-md shadow-sm px-4 py-3 flex justify-between items-center ${darkMode ? 'bg-slate-900/90 border-b border-slate-800' : 'bg-white/90 border-b border-slate-200'}`}>
                    <div className="flex items-center gap-2">
                    <div className="bg-blue-600 p-2 rounded-lg shadow-lg shadow-blue-600/20">
                        <Truck size={20} className="text-white" />
                    </div>
                    <div>
                        <h1 className="font-bold leading-tight text-xl">LOGÍSTICA</h1>
                        <input 
                        type="date" 
                        value={date} 
                        onChange={(e) => setDate(e.target.value)}
                        className="text-sm bg-transparent outline-none text-slate-500 font-medium cursor-pointer hover:text-blue-500 transition-colors"
                        />
                    </div>
                    </div>
                    <div className="flex gap-2 items-center">
                        <button 
                            onClick={() => setCurrentView(currentView === 'dashboard' ? 'report' : 'dashboard')}
                            className={`p-2 rounded-full transition-colors ${currentView === 'report' ? 'bg-blue-100 text-blue-600 shadow-sm' : 'hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'}`}
                            title="Ver Resumen"
                        >
                            {currentView === 'dashboard' ? <FileSpreadsheet size={20} /> : <Truck size={20}/>}
                        </button>
                        
                        <button
                            onClick={() => setShowSettingsModal(true)}
                            className="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-slate-600 dark:text-slate-300"
                            title="Configuración"
                        >
                            <Settings size={20} />
                        </button>
                    </div>
                </header>

                {currentView === 'dashboard' && (
                    <main className="p-4 pb-24 max-w-6xl mx-auto">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        {INITIAL_TRUCKS.map(truckId => {
                        const data = assignments[truckId] || {};
                        const isDeparted = truckStatus[truckId] === 'departed';
                        
                        return (
                            <div key={truckId} className={`relative rounded-xl border-2 transition-all duration-300 group/truck ${
                            isDeparted 
                                ? (darkMode ? 'bg-green-900/20 border-green-800' : 'bg-green-50 border-green-200') 
                                : (darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200 shadow-sm hover:shadow-md')
                            }`}>
                            <div className={`p-3 flex justify-between items-center border-b ${darkMode ? 'border-slate-700' : 'border-slate-100'}`}>
                                <div className="flex items-center gap-3">
                                    <span className={`text-lg font-black px-3 py-1 rounded-lg shadow-sm ${
                                        truckId.startsWith('F') ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'
                                    }`}>
                                        {truckId}
                                    </span>
                                    {isDeparted && <span className="text-xs font-bold text-green-600 flex items-center gap-1 bg-green-100 px-2 py-1 rounded-full"><CheckCircle2 size={12}/> EN RUTA</span>}
                                </div>
                                <button 
                                    onClick={() => toggleTruckStatus(truckId)}
                                    className={`p-2 rounded-full transition-all ${isDeparted ? 'bg-green-500 text-white shadow-lg shadow-green-500/30 scale-110' : 'bg-slate-100 text-slate-400 hover:bg-green-100 hover:text-green-600 dark:bg-slate-700 dark:hover:bg-green-900/50'} active:scale-95`}
                                >
                                    <Truck size={18} />
                                </button>
                            </div>

                            <div className="p-3 space-y-2">
                                <div onClick={() => { setSelectedSlot({ truckId, slotType: 'driver' }); setShowStaffModal(true); }}
                                    className={`p-2 rounded-lg border-2 border-dashed cursor-pointer transition-colors relative group
                                    ${data.driver 
                                        ? (darkMode ? 'bg-slate-700/50 border-slate-600 group-hover/truck:border-blue-500/30' : 'bg-slate-50 border-slate-200 group-hover/truck:border-blue-200') 
                                        : 'bg-red-50/50 border-red-300 hover:bg-red-100/50 animate-pulse-slow'
                                    }`}>
                                <p className="text-[10px] font-bold text-slate-400 uppercase mb-1 flex items-center gap-1"><Truck size={10}/> Entregador / Chofer</p>
                                {data.driver ? (
                                    <div className="flex justify-between items-center">
                                        <span className="font-semibold text-sm truncate">{getStaffById(data.driver)?.name}</span>
                                        {getStaffById(data.driver)?.isDriver && <span className="text-[9px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded font-bold shadow-sm">CHOFER</span>}
                                    </div>
                                ) : (
                                    <span className="text-red-500 text-sm font-medium italic flex items-center gap-1"><AlertCircle size={14}/> Seleccionar Chofer</span>
                                )}
                                </div>

                                {['helper1', 'helper2'].map(slotType => (
                                    <div key={slotType}
                                        onClick={() => { setSelectedSlot({ truckId, slotType }); setShowStaffModal(true); }}
                                        className={`p-2 rounded-lg border-2 border-dashed cursor-pointer transition-colors
                                        ${data[slotType]
                                            ? (darkMode ? 'bg-slate-700/50 border-slate-600' : 'bg-slate-50 border-slate-200') 
                                            : 'border-slate-200 hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800'
                                        }`}>
                                    <p className="text-[10px] font-bold text-slate-400 uppercase mb-1 flex items-center gap-1"><Users size={10}/> {slotType === 'helper1' ? 'Ayudante 1' : 'Ayudante Volante'}</p>
                                    {data[slotType] ? (
                                        <div className="flex justify-between items-center">
                                            <span className="text-sm truncate">{getStaffById(data[slotType])?.name}</span>
                                            <div className="flex gap-1">
                                                {getStaffById(data[slotType])?.isDriver && <span className="text-[9px] bg-red-100 text-red-600 px-1.5 py-0.5 rounded font-bold shadow-sm">CHOFER</span>}
                                                {getStaffById(data[slotType])?.isFletero && <span className="text-[9px] bg-orange-100 text-orange-600 px-1.5 py-0.5 rounded font-bold shadow-sm">FLETERO</span>}
                                            </div>
                                        </div>
                                    ) : (
                                        <span className="text-slate-400 text-sm italic">Vacío</span>
                                    )}
                                    </div>
                                ))}

                                <div className="pt-1">
                                    <input 
                                    type="text" 
                                    placeholder="Añadir observación..."
                                    value={data.observation || ""}
                                    onChange={(e) => updateObservation(truckId, e.target.value)}
                                    className="w-full text-xs bg-transparent border-b-2 border-slate-200 dark:border-slate-700 focus:border-blue-500 outline-none py-1.5 text-slate-600 placeholder:text-slate-300 transition-colors"
                                    />
                                </div>
                            </div>
                            </div>
                        );
                        })}
                    </div>
                    </main>
                )}

                {currentView === 'report' && (
                    <main className="p-4 max-w-4xl mx-auto pb-24">
                    <div className={`p-6 rounded-2xl shadow-xl mb-6 ${darkMode ? 'bg-slate-800' : 'bg-white'}`}>
                        <h2 className="text-3xl font-bold mb-6 flex items-center gap-3">
                            <div className="bg-blue-100 p-2 rounded-lg"><FileSpreadsheet className="text-blue-600" size={28}/></div>
                            Resumen Diario
                        </h2>
                        
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                            <div className={`p-5 rounded-2xl border-2 flex flex-col items-center justify-center gap-2 ${darkMode ? 'bg-green-900/20 border-green-800' : 'bg-green-50 border-green-100'}`}>
                                <div className="bg-green-100 p-3 rounded-full"><Truck className="text-green-600" size={24}/></div>
                                <div className="text-4xl font-black text-green-600">
                                    {Object.values(truckStatus).filter(s => s === 'departed').length}
                                </div>
                                <div className="font-bold text-green-700">Camiones en Ruta</div>
                            </div>
                            <div className={`p-5 rounded-2xl border-2 flex flex-col items-center justify-center gap-2 ${darkMode ? 'bg-slate-700 border-slate-600' : 'bg-slate-50 border-slate-100'}`}>
                                <div className="bg-slate-200 p-3 rounded-full dark:bg-slate-600"><Users className="text-slate-600 dark:text-slate-300" size={24}/></div>
                                <div className="text-4xl font-black text-slate-600 dark:text-slate-300">
                                    {getAvailableStaff().length}
                                </div>
                                <div className="font-bold text-slate-600 dark:text-slate-400">Personal Disponible</div>
                            </div>
                            <div className={`p-5 rounded-2xl border-2 flex flex-col items-center justify-center gap-2 ${darkMode ? 'bg-red-900/20 border-red-800' : 'bg-red-50 border-red-100'}`}>
                                <div className="bg-red-100 p-3 rounded-full"><UserX className="text-red-600" size={24}/></div>
                                <div className="text-4xl font-black text-red-600">
                                    {getAbsentStaff().length}
                                </div>
                                <div className="font-bold text-red-700">Personal Ausente</div>
                            </div>
                        </div>

                        <div className="grid md:grid-cols-2 gap-8">
                            <div>
                                <h3 className="font-bold text-xl mb-4 flex items-center gap-2 text-slate-700 dark:text-slate-300"><Users size={20}/> Disponibles para Asignar</h3>
                                <ul className={`space-y-2 max-h-[300px] overflow-y-auto p-2 rounded-xl border ${darkMode ? 'border-slate-700 bg-slate-900/30' : 'border-slate-100 bg-slate-50'}`}>
                                    {getAvailableStaff().map(p => (
                                        <li key={p.id} className="flex items-center justify-between p-2 rounded bg-white dark:bg-slate-700 shadow-sm border border-slate-100 dark:border-slate-600">
                                            <div className="flex items-center gap-3">
                                                <div className={`w-3 h-3 rounded-full ${p.isDriver ? 'bg-red-500 shadow-sm shadow-red-500/50' : 'bg-slate-300'}`}></div>
                                                <div>
                                                    <span className={`font-bold block ${p.isDriver ? 'text-red-600 dark:text-red-400' : ''}`}>{p.name}</span>
                                                    <span className="text-xs opacity-60">({p.role})</span>
                                                </div>
                                            </div>
                                            <button onClick={() => markAsAbsent(p.id)} className="p-1 text-slate-300 hover:text-red-500 transition-colors" title="Marcar como Ausente"><UserX size={16}/></button>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            <div>
                                <h3 className="font-bold text-xl mb-4 flex items-center gap-2 text-red-600 dark:text-red-400"><UserX size={20}/> Ausentes Hoy</h3>
                                <ul className={`space-y-2 max-h-[300px] overflow-y-auto p-2 rounded-xl border ${darkMode ? 'border-red-900/30 bg-red-900/10' : 'border-red-100 bg-red-50'}`}>
                                    {getAbsentStaff().map(p => (
                                        <li key={p.id} className="flex items-center justify-between p-2 rounded bg-white dark:bg-slate-700 shadow-sm border border-red-100 dark:border-red-900/30">
                                            <div className="flex items-center gap-3 opacity-60">
                                                <UserX size={16} className="text-red-400"/>
                                                <span className="font-bold strike-through decoration-red-500">{p.name}</span>
                                            </div>
                                            <button onClick={() => markAsPresent(p.id)} className="p-1 text-red-300 hover:text-green-500 transition-colors font-bold text-xs" title="Marcar como Presente">VOLVER A DISPONIBLE</button>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>
                        
                        <div className="mt-8 pt-6 border-t dark:border-slate-700">
                            <button 
                                onClick={exportPDF}
                                className="w-full py-4 bg-red-600 hover:bg-red-700 text-white rounded-2xl font-black text-lg shadow-xl shadow-red-600/20 flex items-center justify-center gap-3 transition-all transform hover:scale-[1.01] active:scale-95"
                            >
                                <FileText size={28}/>
                                Descargar Reporte Diario en PDF
                            </button>
                        </div>
                    </div>
                    </main>
                )}

                <StaffSelectorModal 
                    isOpen={showStaffModal} 
                    onClose={() => setShowStaffModal(false)}
                    availableStaff={getAvailableStaff()}
                    onAssign={handleAssign}
                    onMarkAbsent={handleMarkCurrentSlotAbsent}
                    darkMode={darkMode}
                />
                
                <ManageStaffModal 
                    isOpen={showManageStaffModal}
                    onClose={() => setShowManageStaffModal(false)}
                    staff={staff}
                    onAdd={handleAddStaff}
                    onDelete={handleDeleteStaff}
                    onToggleDriver={toggleDriverStatus}
                    newStaffData={newStaffData}
                    setNewStaffData={setNewStaffData}
                    darkMode={darkMode}
                />

                <SettingsModal 
                    isOpen={showSettingsModal}
                    onClose={() => setShowSettingsModal(false)}
                    darkMode={darkMode}
                    toggleTheme={() => setDarkMode(!darkMode)}
                    onOpenManageStaff={() => setShowManageStaffModal(true)}
                />

                <div className="fixed bottom-6 right-6 lg:hidden z-50">
                    <button 
                        onClick={() => setCurrentView(currentView === 'dashboard' ? 'report' : 'dashboard')}
                        className={`w-14 h-14 text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-105 active:scale-95 transition-all border-4 border-white dark:border-slate-800
                            ${currentView === 'dashboard' ? 'bg-green-600' : 'bg-blue-600'}
                        `}
                    >
                        {currentView === 'dashboard' ? <CheckSquare size={24} /> : <Truck size={24} />}
                    </button>
                </div>

                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
