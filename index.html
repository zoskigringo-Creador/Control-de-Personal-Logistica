<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOGÍSTICA - Control de Personal</title>
    
    <!-- Meta tags para modo Pantalla Completa y evitar comportamientos raros en móviles -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Librerías Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    
    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Manifiesto PWA embebido para Android/iOS -->
    <link rel="manifest" id="my-manifest">
    <script>
        const manifest = {
            "name": "Logística App",
            "short_name": "Logística",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#2563eb",
            "orientation": "portrait",
            "icons": [
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/716/716736.png",
                    "sizes": "192x192",
                    "type": "image/png"
                },
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/716/716736.png",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };
        const stringManifest = JSON.stringify(manifest);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        document.querySelector('#my-manifest').setAttribute('href', manifestURL);
    </script>

    <style>
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        .animate-in { animation: slideIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* BLOQUEO CRÍTICO DE PULL-TO-REFRESH PARA IPHONE Y SAMSUNG */
        html, body { 
            overscroll-behavior-y: none !important; 
            overscroll-behavior: none !important;
            -webkit-overflow-scrolling: touch;
            -webkit-tap-highlight-color: transparent; 
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-slate-100 overscroll-none">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Truck, Users, Moon, Sun, FileSpreadsheet, FileText, CheckCircle2, 
            AlertCircle, UserMinus, UserX, UserPlus, Settings, X, Search, 
            Plus, ToggleLeft, ToggleRight, Trash2, RotateCcw, 
            Cloud, Check, Loader2, ClipboardCheck, Eye
        } from 'lucide-react';

        // --- IMPORTACIONES DE FIREBASE ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURACIÓN DE FIREBASE ---
        let firebaseConfig;
        if (typeof __firebase_config !== 'undefined') {
            firebaseConfig = JSON.parse(__firebase_config);
        } else {
            // TUS DATOS DE FIREBASE
            firebaseConfig = {
                apiKey: "AIzaSyAVm6bz2J4yGaD4wcoJ56zO22KR9NnskOE",
                authDomain: "logistica---control-y-espejo.firebaseapp.com",
                projectId: "logistica---control-y-espejo",
                storageBucket: "logistica---control-y-espejo.firebasestorage.app",
                messagingSenderId: "157387224472",
                appId: "1:157387224472:web:7da4fb4f329533d43be7ed",
                measurementId: "G-Q8JW9XKF57"
            };
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'logistica-app-prod';

        // --- DATOS INICIALES ---
        const INITIAL_TRUCKS = [
            "C14", "C15", "C16", "C17", "C18", "C19", "C20", 
            "C26", "C27", "C28", "C29", "C30", "C31", "C32", 
            "C33", "C34", "C36", "C37", "F2", "F1", 
            "C35", "C38", "C39", "C40", "C41", "C42", "C44", "C43"
        ];

        const INITIAL_STAFF_DATA = [
            { id: 1, name: "Juan Cabrera", role: "Entregador", isDriver: false },
            { id: 2, name: "Hector Valiente", role: "Ayudante", isDriver: true },
            { id: 3, name: "Bryan Britez", role: "Volante", isDriver: false },
            { id: 4, name: "Roberto Lopez", role: "Entregador", isDriver: false },
            { id: 5, name: "Juan Villamayor", role: "Ayudante", isDriver: true },
            { id: 6, name: "Marcelo Melgarejo", role: "Entregador", isDriver: true },
            { id: 7, name: "Lucas Martinez", role: "Ayudante", isDriver: false },
            { id: 8, name: "Hugo Olmedo", role: "Entregador", isDriver: true },
            { id: 9, name: "Diego Cordoba", role: "Ayudante", isDriver: false },
            { id: 10, name: "Ismael Gimenez", role: "Volante", isDriver: true },
            { id: 11, name: "Isaias Jara", role: "Entregador", isDriver: true },
            { id: 12, name: "Edgar Avalos", role: "Ayudante", isDriver: false },
            { id: 13, name: "Jose Caballero", role: "Entregador", isDriver: true },
            { id: 14, name: "Alexander Martinez", role: "Ayudante", isDriver: false },
            { id: 15, name: "Rody Gonzalez", role: "Entregador", isDriver: true },
            { id: 16, name: "Lizandro Cuba", role: "Ayudante", isDriver: false },
            { id: 17, name: "Juan Samudio", role: "Entregador", isDriver: true },
            { id: 18, name: "Dario Rolon", role: "Ayudante", isDriver: false },
            { id: 19, name: "Jose Orrego", role: "Volante", isDriver: true },
            { id: 20, name: "Ayrton Delgado", role: "Entregador", isDriver: true },
            { id: 21, name: "Joaquin Ayala", role: "Ayudante", isDriver: false },
            { id: 22, name: "Mathias Huesped", role: "Entregador", isDriver: true },
            { id: 23, name: "Victor Espinoza", role: "Ayudante", isDriver: false },
            { id: 24, name: "Junior Caceres", role: "Volante", isDriver: false },
            { id: 25, name: "Nicolas Vega", role: "Entregador", isDriver: false },
            { id: 26, name: "Alberto Caceres", role: "Ayudante", isDriver: true },
            { id: 27, name: "Cesar Duarte", role: "Volante", isDriver: true },
            { id: 28, name: "Antonio Mereles", role: "Entregador", isDriver: false },
            { id: 29, name: "Gabriel Flores", role: "Ayudante", isDriver: true },
            { id: 30, name: "Nestor Ruis Diaz", role: "Entregador", isDriver: true },
            { id: 31, name: "Juan Velasquez", role: "Ayudante", isDriver: false },
            { id: 32, name: "Arsenio Mendieta", role: "Entregador", isDriver: true },
            { id: 33, name: "Jorge Jara", role: "Ayudante", isDriver: false },
            { id: 34, name: "Lucas Infran", role: "Volante", isDriver: false },
            { id: 35, name: "Juan Pereira", role: "Entregador", isDriver: true },
            { id: 36, name: "Alberto Franco", role: "Ayudante", isDriver: false },
            { id: 37, name: "Carlos Ruiz", role: "Entregador", isDriver: true },
            { id: 38, name: "Fletero 1", role: "Ayudante", isDriver: false, isFletero: true },
            { id: 39, name: "Nicolas Vera", role: "Entregador", isDriver: false },
            { id: 40, name: "Fletero 2", role: "Ayudante", isDriver: false, isFletero: true },
            { id: 41, name: "Nicolas Rojas", role: "Entregador", isDriver: true },
            { id: 42, name: "Marcos Sanchez", role: "Entregador", isDriver: true },
            { id: 43, name: "Cristhian Benitez", role: "Entregador", isDriver: true },
            { id: 44, name: "Orlando Penayo", role: "Entregador", isDriver: true },
            { id: 45, name: "Pablo Quiñonez", role: "Entregador", isDriver: true },
            { id: 46, name: "Walter Caballero", role: "Entregador", isDriver: true },
            { id: 47, name: "Juan Rolon", role: "Entregador", isDriver: true },
            { id: 48, name: "Gustavo Caceres", role: "Entregador", isDriver: true },
        ];

        const createEmptyAssignments = () => {
            const empty = {};
            INITIAL_TRUCKS.forEach(truckId => {
                empty[truckId] = { driver: null, helper1: null, helper2: null, observation: "" };
            });
            return empty;
        };

        const INITIAL_ASSIGNMENTS = createEmptyAssignments();

        // --- COMPONENTES MODALES ---
        
        // Ventana para Confirmar Salida y agregar Observación
        const DispatchModal = ({ isOpen, onClose, onConfirm, truckId, initialObservation, darkMode }) => {
            const [obs, setObs] = useState('');
            
            useEffect(() => { 
                if (isOpen) setObs(initialObservation || ''); 
            }, [isOpen, initialObservation]);

            if (!isOpen) return null;

            return (
                <div className={`fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in`}>
                    <div className={`${darkMode ? 'bg-slate-800 text-white' : 'bg-white text-slate-900'} w-full max-w-sm rounded-2xl shadow-2xl flex flex-col`}>
                        <div className="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-blue-50 dark:bg-slate-900/50 rounded-t-2xl">
                            <h3 className="font-bold text-lg flex items-center gap-2"><Truck size={20}/> Despachar Móvil {truckId}</h3>
                            <button onClick={onClose} className="p-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full"><X size={20} /></button>
                        </div>
                        <div className="p-4">
                            <p className="text-sm mb-3 font-medium opacity-80">¿Confirmas la salida de este móvil? Puedes dejar una observación si amerita.</p>
                            <textarea 
                                value={obs}
                                onChange={(e) => setObs(e.target.value)}
                                placeholder="Ej: Sale con retraso, falta un ayudante..."
                                className="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 outline-none focus:border-blue-500 resize-none h-24 text-sm"
                            ></textarea>
                            <button 
                                onClick={() => onConfirm(obs)}
                                className="w-full mt-4 p-3 bg-green-600 hover:bg-green-500 text-white rounded-xl font-bold transition-all shadow-lg shadow-green-600/30 flex justify-center items-center gap-2"
                            >
                                <CheckCircle2 size={20}/> Confirmar Salida
                            </button>
                        </div>
                    </div>
                </div>
            )
        };

        const StaffSelectorModal = ({ isOpen, onClose, staffList, assignments, onAssign, onMarkAbsent, darkMode, isAdmin }) => {
            const [searchTerm, setSearchTerm] = useState('');

            // Limpiar buscador al abrir el modal
            useEffect(() => {
                if (isOpen) setSearchTerm('');
            }, [isOpen]);

            if (!isOpen || !isAdmin) return null;

            // Calcular en qué camión está asignada cada persona actualmente
            const staffWithStatus = staffList.map(person => {
                let assignedTruck = null;
                Object.entries(assignments).forEach(([tId, truck]) => {
                    if (truck && (truck.driver === person.id || truck.helper1 === person.id || truck.helper2 === person.id)) {
                        assignedTruck = tId;
                    }
                });
                return { ...person, assignedTruck };
            });

            // Filtrar por la búsqueda
            const filteredStaff = staffWithStatus.filter(p => 
                p.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                p.role.toLowerCase().includes(searchTerm.toLowerCase())
            );

            const handlePersonClick = (person) => {
                if (person.assignedTruck) {
                    if(window.confirm(`${person.name} ya está asignado/a en el móvil ${person.assignedTruck}.\n\n¿Deseas FORZAR el cambio y mover a esta persona aquí?`)) {
                        onAssign(person.id);
                    }
                } else {
                    onAssign(person.id);
                }
            };

            return (
                <div className={`fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm`}>
                    <div className={`${darkMode ? 'bg-slate-800 text-white' : 'bg-white text-slate-900'} w-full max-w-md rounded-2xl shadow-2xl flex flex-col max-h-[85vh]`}>
                        <div className="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                            <h3 className="font-bold text-lg">Seleccionar Personal</h3>
                            <button onClick={onClose} className="p-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors"><X size={24} /></button>
                        </div>

                        {/* Buscador */}
                        <div className="p-3 border-b border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50">
                            <div className="relative">
                                <Search className="absolute left-3 top-3 text-slate-400" size={18} />
                                <input 
                                    type="text" 
                                    placeholder="Buscar por nombre o rol..." 
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 outline-none focus:border-blue-500 shadow-sm"
                                />
                            </div>
                        </div>
                        
                        <div className="p-2 grid grid-cols-2 gap-2 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50">
                            <button 
                                onClick={onMarkAbsent}
                                className="flex items-center justify-center gap-2 p-3 rounded-lg bg-red-100 text-red-600 hover:bg-red-200 transition-colors font-bold text-sm"
                            >
                                <UserX size={18} /> Marcar AUSENTE
                            </button>
                            <button 
                                onClick={() => onAssign(null)}
                                className="flex items-center justify-center gap-2 p-3 rounded-lg bg-slate-200 text-slate-600 hover:bg-slate-300 transition-colors font-bold text-sm"
                            >
                                <UserMinus size={18} /> Quitar (Vaciar)
                            </button>
                        </div>

                        <div className="overflow-y-auto p-2 flex-1">
                            <h4 className="text-xs font-bold text-slate-400 uppercase mb-2 px-1">
                                {searchTerm ? 'Resultados de Búsqueda' : 'Lista de Personal'}
                            </h4>
                            {filteredStaff.map(person => (
                                <button
                                    key={person.id}
                                    onClick={() => handlePersonClick(person)}
                                    className={`w-full text-left p-3 rounded-lg mb-2 flex items-center justify-between group transition-all
                                        ${person.isDriver ? 'bg-blue-50 dark:bg-blue-900/20 border border-blue-200' : 'bg-slate-50 dark:bg-slate-700/50 border border-slate-100'}
                                        ${person.assignedTruck ? 'opacity-70 border-dashed border-2' : ''}
                                        hover:scale-[1.02] active:scale-95
                                    `}
                                >
                                    <div>
                                        <div className="font-semibold">{person.name}</div>
                                        <div className="text-xs text-slate-500 flex gap-2 items-center">
                                            <span>{person.role}</span>
                                            {person.assignedTruck && (
                                                <span className="text-[10px] font-bold bg-yellow-100 text-yellow-700 px-1.5 py-0.5 rounded border border-yellow-200">
                                                    En {person.assignedTruck}
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                    <div className="flex gap-1 flex-col items-end">
                                        {person.isDriver && <span className="text-[10px] font-bold text-red-500 bg-red-100 px-1.5 py-0.5 rounded">CHOFER</span>}
                                        {person.isFletero && <span className="text-[10px] font-bold text-orange-600 bg-orange-100 px-1.5 py-0.5 rounded">FLETERO</span>}
                                    </div>
                                </button>
                            ))}
                            {filteredStaff.length === 0 && (
                                <p className="text-center text-slate-400 py-6 text-sm flex flex-col items-center gap-2">
                                    <Search size={32} className="opacity-20" />
                                    No se encontró nadie con ese nombre
                                </p>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ManageStaffModal = ({ isOpen, onClose, staff, onAdd, onDelete, onToggleDriver, newStaffData, setNewStaffData, darkMode, isAdmin }) => {
            if (!isOpen || !isAdmin) return null;

            return (
                <div className={`fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in`}>
                <div className={`${darkMode ? 'bg-slate-800 text-white' : 'bg-white text-slate-900'} w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col max-h-[90vh]`}>
                    
                    <div className="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900/50 rounded-t-2xl">
                    <h3 className="font-bold text-xl flex items-center gap-2"><Users/> Gestión de Personal</h3>
                    <button onClick={onClose} className="p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full"><X size={24} /></button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4">
                        
                        <div className={`p-4 rounded-xl mb-6 ${darkMode ? 'bg-slate-700/50 border-slate-600' : 'bg-blue-50/50 border-blue-100'} border-2`}>
                            <h4 className="font-bold mb-3 flex items-center gap-2 text-blue-600 dark:text-blue-400"><UserPlus size={18}/> Agregar Nuevo Personal</h4>
                            
                            <div className="flex flex-col gap-3">
                                <div>
                                    <label className="text-xs font-bold text-slate-500 mb-1 block">Nombre Completo</label>
                                    <input 
                                        type="text" 
                                        value={newStaffData.name}
                                        onChange={e => setNewStaffData({ ...newStaffData, name: e.target.value })}
                                        className="w-full p-3 rounded-lg border bg-white dark:bg-slate-800 dark:border-slate-600 outline-none focus:border-blue-500 text-base"
                                        placeholder="Ej: Juan Pérez"
                                    />
                                </div>
                                
                                <div className="flex gap-3">
                                    <div className="flex-1">
                                        <label className="text-xs font-bold text-slate-500 mb-1 block">Rol Principal</label>
                                        <select
                                            value={newStaffData.role}
                                            onChange={e => setNewStaffData({ ...newStaffData, role: e.target.value })}
                                            className="w-full p-3 rounded-lg border bg-white dark:bg-slate-800 dark:border-slate-600 outline-none focus:border-blue-500 h-[50px]"
                                        >
                                            <option value="Entregador">Entregador</option>
                                            <option value="Ayudante">Ayudante</option>
                                            <option value="Volante">Volante</option>
                                        </select>
                                    </div>
                                    <div className="flex-none">
                                        <label className="text-xs font-bold text-slate-500 mb-1 block opacity-0">.</label>
                                        <label className={`flex items-center justify-center gap-2 cursor-pointer p-3 border rounded-lg h-[50px] transition-colors ${newStaffData.isDriver ? 'bg-red-50 border-red-300 dark:bg-red-900/20 dark:border-red-800' : 'bg-white dark:bg-slate-800 dark:border-slate-600'}`}>
                                            <input 
                                                type="checkbox"
                                                checked={newStaffData.isDriver}
                                                onChange={e => setNewStaffData({ ...newStaffData, isDriver: e.target.checked })}
                                                className="w-5 h-5 accent-red-500"
                                            />
                                            <span className={`font-bold text-sm ${newStaffData.isDriver ? 'text-red-600' : 'text-slate-500'}`}>Es Chofer</span>
                                        </label>
                                    </div>
                                </div>

                                <button 
                                    onClick={onAdd}
                                    disabled={!newStaffData.name.trim()}
                                    className="w-full p-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed font-bold flex items-center justify-center gap-2 mt-2 shadow-lg shadow-blue-500/30"
                                >
                                    <Plus size={20}/> Guardar Nuevo
                                </button>
                            </div>
                        </div>

                        <h4 className="font-bold mb-3 text-lg">Directorio de Personal ({staff.length})</h4>
                        <div className="space-y-2">
                            {[...staff].sort((a, b) => a.name.localeCompare(b.name)).map(person => (
                                <div key={person.id} className={`flex items-center justify-between p-3 rounded-lg border ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-100'} shadow-sm`}>
                                    <div>
                                        <div className="font-bold text-lg">{person.name}</div>
                                        <div className="text-sm opacity-70 flex items-center gap-2">
                                            {person.role}
                                            {person.isFletero && <span className="text-xs bg-orange-100 text-orange-700 px-1 rounded">Fletero</span>}
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                         <button
                                            onClick={() => onToggleDriver(person.id)}
                                            type="button" 
                                            className={`flex items-center gap-2 px-3 py-1.5 rounded-full font-bold text-xs transition-colors border-2 ${
                                                person.isDriver 
                                                ? 'bg-red-100 text-red-600 border-red-200 dark:bg-red-900/30 dark:border-red-800' 
                                                : 'bg-slate-100 text-slate-500 border-slate-200 dark:bg-slate-700 dark:border-slate-600'
                                            }`}
                                         >
                                            {person.isDriver ? <ToggleRight className="text-red-500" size={16}/> : <ToggleLeft size={16}/>}
                                            {person.isDriver ? 'CHOFER' : 'No Chofer'}
                                         </button>
                                         <button 
                                            onClick={() => onDelete(person.id)}
                                            className="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition-colors"
                                            title="Eliminar Personal"
                                         >
                                            <Trash2 size={20}/>
                                         </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
                </div>
            );
        };

        const SettingsModal = ({ isOpen, onClose, darkMode, toggleTheme, onOpenManageStaff, onResetDay, isAdmin }) => {
            if (!isOpen) return null;
            
            return (
                <div 
                    className="fixed inset-0 z-50 flex items-start justify-end p-4 bg-black/20 backdrop-blur-[2px]"
                    onClick={onClose}
                >
                    <div 
                        className={`w-64 mt-14 rounded-2xl shadow-2xl border flex flex-col overflow-hidden animate-in slide-in-from-top-5 ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200 text-slate-900'}`}
                        onClick={e => e.stopPropagation()}
                    >
                        <div className="p-4 border-b border-slate-200 dark:border-slate-700 font-bold bg-slate-50 dark:bg-slate-900/50">
                            Configuración
                        </div>
                        
                        <div className="p-2">
                            <button 
                                onClick={() => { toggleTheme(); }}
                                className="w-full text-left p-3 rounded-lg flex items-center gap-3 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors"
                            >
                                {darkMode ? <Sun className="text-orange-400" size={20} /> : <Moon className="text-slate-600" size={20} />}
                                <span className="font-medium">Tema {darkMode ? 'Claro' : 'Oscuro'}</span>
                            </button>

                            {isAdmin && (
                                <>
                                    <button 
                                        onClick={() => { onClose(); onOpenManageStaff(); }}
                                        className="w-full text-left p-3 rounded-lg flex items-center gap-3 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors text-blue-600 dark:text-blue-400"
                                    >
                                        <Users size={20} />
                                        <span className="font-medium">Gestionar Personal</span>
                                    </button>

                                    <button 
                                        onClick={onResetDay}
                                        className="w-full text-left p-3 rounded-lg flex items-center gap-3 hover:bg-red-50 text-red-600 dark:hover:bg-red-900/20 transition-colors mt-2 border-t border-slate-100 dark:border-slate-700"
                                    >
                                        <RotateCcw size={20} />
                                        <span className="font-bold">Borrar TODO el día</span>
                                    </button>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- APP PRINCIPAL ---
        function App() {
            const [showSplash, setShowSplash] = useState(true);
            const [darkMode, setDarkMode] = useState(false);
            const [currentView, setCurrentView] = useState('dashboard');
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [globalSearch, setGlobalSearch] = useState('');
            
            // Estados de Autenticación
            const [firebaseUser, setFirebaseUser] = useState(null);
            const [authStep, setAuthStep] = useState('login'); 
            const [userRole, setUserRole] = useState(null); 
            const [saveStatus, setSaveStatus] = useState('saved'); 
            const [isDataLoaded, setIsDataLoaded] = useState(false);
            
            // Estado de Negocio
            const [assignments, setAssignments] = useState(INITIAL_ASSIGNMENTS);
            const [truckStatus, setTruckStatus] = useState({}); 
            const [staff, setStaff] = useState(INITIAL_STAFF_DATA); 
            const [absentStaffIds, setAbsentStaffIds] = useState(new Set());

            const [selectedSlot, setSelectedSlot] = useState(null); 
            const [showStaffModal, setShowStaffModal] = useState(false);
            const [showManageStaffModal, setShowManageStaffModal] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [dispatchModal, setDispatchModal] = useState({ isOpen: false, truckId: null, observation: '' });
            
            const [newStaffData, setNewStaffData] = useState({ name: '', role: 'Ayudante', isDriver: false });
            const pdfLibraryLoaded = useRef(false);

            // 1. ADVERTENCIA AL RECARGAR Y CARGA DE FIREBASE
            useEffect(() => {
                const handleBeforeUnload = (e) => {
                    if (authStep === 'app') {
                        e.preventDefault();
                        e.returnValue = '¿Seguro que deseas recargar o salir?';
                        return e.returnValue;
                    }
                };
                window.addEventListener('beforeunload', handleBeforeUnload);

                const initAuth = async () => {
                    try {
                        // Usamos token si existe en la vista previa
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token && typeof __firebase_config !== 'undefined') {
                            try {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } catch (e) {
                                console.warn("Falló inicio de sesión con token, usando anónimo...");
                                await signInAnonymously(auth);
                            }
                        } else {
                            // En GitHub usa siempre el login anónimo de tu Firebase
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.error("Error conectando a Firebase:", e);
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, user => {
                    setFirebaseUser(user);
                });

                if (window.jspdf) pdfLibraryLoaded.current = true;
                setTimeout(() => setShowSplash(false), 2000);

                return () => {
                    unsubscribe();
                    window.removeEventListener('beforeunload', handleBeforeUnload);
                };
            }, [authStep]);

            // 2. Sincronización en Tiempo Real (Efecto Espejo) y Lógica de "Copiar Día Anterior"
            useEffect(() => {
                if (!firebaseUser || authStep !== 'app') return;
                setIsDataLoaded(false);

                // Escuchar datos del día actual
                const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'logistica_daily', date);
                const unsubDaily = onSnapshot(docRef, async (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setAssignments(data.assignments || INITIAL_ASSIGNMENTS);
                        setTruckStatus(data.truckStatus || {});
                        setAbsentStaffIds(new Set(data.absentStaffIds || []));
                    } else {
                        // Si no hay datos (día en blanco) y es administrador: copiamos la última plantilla guardada.
                        if (userRole === 'admin') {
                            const latestRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'logistica_daily', 'latest_template');
                            try {
                                const latestSnap = await getDoc(latestRef);
                                if (latestSnap.exists()) {
                                    setAssignments(latestSnap.data().assignments || createEmptyAssignments());
                                } else {
                                    setAssignments(createEmptyAssignments());
                                }
                            } catch(e) {
                                setAssignments(createEmptyAssignments());
                            }
                        } else {
                            setAssignments(createEmptyAssignments());
                        }
                        // Status y ausencias se resetean aunque se copie la plantilla.
                        setTruckStatus({});
                        setAbsentStaffIds(new Set());
                    }
                    setTimeout(() => setIsDataLoaded(true), 100);
                }, (err) => console.error(err));

                // Escuchar directorio de personal
                const staffRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'logistica_system', 'staff_directory');
                const unsubStaff = onSnapshot(staffRef, (docSnap) => {
                    if (docSnap.exists()) {
                        setStaff(docSnap.data().staffList || INITIAL_STAFF_DATA);
                    } else if (userRole === 'admin') {
                        setDoc(staffRef, { staffList: INITIAL_STAFF_DATA });
                    }
                });

                return () => {
                    unsubDaily();
                    unsubStaff();
                };
            }, [firebaseUser, date, authStep, userRole]);

            // 3. Guardado Automático (Solo Admin)
            useEffect(() => {
                if (userRole !== 'admin' || !isDataLoaded || !firebaseUser || authStep !== 'app') return;

                setSaveStatus('saving');
                const docRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'logistica_daily', date);
                const latestRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'logistica_daily', 'latest_template');
                
                const dataToSave = {
                    assignments,
                    truckStatus,
                    absentStaffIds: Array.from(absentStaffIds)
                };
                
                // Guardamos el día actual
                setDoc(docRef, dataToSave, { merge: true })
                    .then(() => {
                        // También actualizamos la "plantilla" base para los días siguientes
                        setDoc(latestRef, { assignments }, { merge: true });
                        setSaveStatus('saved');
                    })
                    .catch(() => setSaveStatus('error'));

            }, [assignments, truckStatus, absentStaffIds, isDataLoaded, userRole, firebaseUser, date, authStep]);


            // --- Lógica de Negocio ---
            const getStaffById = (id) => staff.find(s => s.id === id);

            // Calcula quiénes NO están ausentes
            const getNonAbsentStaff = () => staff.filter(s => !absentStaffIds.has(s.id));

            // Calcula quiénes están libres (Para reporte)
            const getCompletelyFreeStaff = () => {
                const assignedIds = new Set();
                Object.values(assignments).forEach(truck => {
                    if (!truck) return;
                    if (truck.driver) assignedIds.add(truck.driver);
                    if (truck.helper1) assignedIds.add(truck.helper1);
                    if (truck.helper2) assignedIds.add(truck.helper2);
                });
                return staff.filter(s => !assignedIds.has(s.id) && !absentStaffIds.has(s.id));
            };
            
            const getAbsentStaff = () => staff.filter(s => absentStaffIds.has(s.id));

            // Acciones (Solo admin)
            const handleAssign = (personId) => {
                if (userRole !== 'admin' || !selectedSlot) return;
                const { truckId, slotType } = selectedSlot;

                setAssignments(prev => {
                    const newAssignments = { ...prev };
                    
                    if (personId) {
                        Object.keys(newAssignments).forEach(tId => {
                            const truck = { ...newAssignments[tId] };
                            let changed = false;
                            if (truck.driver === personId) { truck.driver = null; changed = true; }
                            if (truck.helper1 === personId) { truck.helper1 = null; changed = true; }
                            if (truck.helper2 === personId) { truck.helper2 = null; changed = true; }
                            if (changed) newAssignments[tId] = truck;
                        });
                    }

                    const targetTruck = { ...(newAssignments[truckId] || { driver: null, helper1: null, helper2: null, observation: "" }) };
                    targetTruck[slotType] = personId;
                    newAssignments[truckId] = targetTruck;
                    return newAssignments;
                });
                
                setShowStaffModal(false);
                setSelectedSlot(null);
            };

            const handleTruckStatusClick = (truckId) => {
                if (userRole !== 'admin') return;
                const isDeparted = truckStatus[truckId] === 'departed';
                if (isDeparted) {
                    // Si ya salió, con un click lo devolvemos a "Pendiente"
                    setTruckStatus(prev => ({ ...prev, [truckId]: 'pending' }));
                } else {
                    // Si está pendiente, abrimos la ventana de confirmación / observación
                    const currentObs = assignments[truckId]?.observation || '';
                    setDispatchModal({ isOpen: true, truckId, observation: currentObs });
                }
            };

            const confirmDispatch = (observation) => {
                const { truckId } = dispatchModal;
                setAssignments(prev => {
                    const newAssignments = { ...prev };
                    const targetTruck = { ...(newAssignments[truckId] || { driver: null, helper1: null, helper2: null, observation: "" }) };
                    targetTruck.observation = observation;
                    newAssignments[truckId] = targetTruck;
                    return newAssignments;
                });
                setTruckStatus(prev => ({ ...prev, [truckId]: 'departed' }));
                setDispatchModal({ isOpen: false, truckId: null, observation: '' });
            };

            const markAsAbsent = (id) => {
                if (userRole !== 'admin' || !id) return;
                setAssignments(prev => {
                    const newAssignments = { ...prev };
                    Object.keys(newAssignments).forEach(tId => {
                        const truck = { ...newAssignments[tId] };
                        if (truck.driver === id) truck.driver = null;
                        if (truck.helper1 === id) truck.helper1 = null;
                        if (truck.helper2 === id) truck.helper2 = null;
                        newAssignments[tId] = truck;
                    });
                    return newAssignments;
                });
                setAbsentStaffIds(prev => new Set(prev).add(id));
            };

            const markAsPresent = (id) => {
                if (userRole !== 'admin' || !id) return;
                setAbsentStaffIds(prev => {
                    const newSet = new Set(prev);
                    newSet.delete(id);
                    return newSet;
                });
            };

            const handleMarkCurrentSlotAbsent = () => {
                if(!selectedSlot) return;
                const { truckId, slotType } = selectedSlot;
                const currentPersonId = assignments[truckId]?.[slotType];
                if (currentPersonId) markAsAbsent(currentPersonId);
                setShowStaffModal(false);
            };

            // Gestión personal (Admin)
            const handleAddStaff = () => {
                if (userRole !== 'admin' || !newStaffData.name.trim()) return;
                const newId = staff.length > 0 ? Math.max(...staff.map(s => s.id)) + 1 : 1;
                const newPerson = { ...newStaffData, id: newId, isFletero: false };
                const updatedStaffList = [...staff, newPerson];
                setStaff(updatedStaffList);
                setNewStaffData({ name: '', role: 'Ayudante', isDriver: false }); 
                const staffRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'logistica_system', 'staff_directory');
                setDoc(staffRef, { staffList: updatedStaffList });
            };
            
            const handleDeleteStaff = (id) => {
                if (userRole !== 'admin') return;
                if (window.confirm('¿Seguro que deseas eliminar a esta persona del sistema?')) {
                    setAssignments(prev => {
                        const newAssignments = { ...prev };
                        Object.keys(newAssignments).forEach(tId => {
                            const truck = { ...newAssignments[tId] };
                            if (truck.driver === id) truck.driver = null;
                            if (truck.helper1 === id) truck.helper1 = null;
                            if (truck.helper2 === id) truck.helper2 = null;
                            newAssignments[tId] = truck;
                        });
                        return newAssignments;
                    });
                    setAbsentStaffIds(prev => {
                        const newSet = new Set(prev);
                        newSet.delete(id);
                        return newSet;
                    });
                    const updatedStaffList = staff.filter(s => s.id !== id);
                    setStaff(updatedStaffList);
                    const staffRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'logistica_system', 'staff_directory');
                    setDoc(staffRef, { staffList: updatedStaffList });
                }
            };

            const toggleDriverStatus = (id) => {
                if (userRole !== 'admin') return;
                const updatedStaffList = staff.map(s => s.id === id ? { ...s, isDriver: !s.isDriver } : s);
                setStaff(updatedStaffList);
                const staffRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'logistica_system', 'staff_directory');
                setDoc(staffRef, { staffList: updatedStaffList });
            };

            const handleResetDay = () => {
                if (userRole !== 'admin') return;
                if (window.confirm("¿Estás seguro de que quieres REINICIAR todo el día? Se borrará todo.")) {
                    setAssignments(createEmptyAssignments());
                    setTruckStatus({});
                    setAbsentStaffIds(new Set());
                    setShowSettingsModal(false);
                }
            };

            const exportPDF = () => {
                if (!pdfLibraryLoaded.current && !window.jspdf) {
                    alert("Cargando creador de PDF. Intente de nuevo.");
                    return;
                }
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const margin = 14;
                let currentY = margin;

                doc.setFontSize(18);
                doc.text("Reporte Diario de Logística", margin, currentY);
                currentY += 10;
                doc.setFontSize(12);
                doc.text(`Fecha: ${date}`, margin, currentY);
                currentY += 15;

                const tableHeaders = [["Móvil", "Entregador/Chofer", "Ayudante 1", "Ayudante 2", "Observación"]];
                const getTableData = (truckIds) => {
                    return truckIds.map(truckId => {
                        const data = assignments[truckId] || {};
                        const driver = data.driver ? getStaffById(data.driver)?.name || "-" : "-";
                        const h1 = data.helper1 ? getStaffById(data.helper1)?.name || "-" : "-";
                        const h2 = data.helper2 ? getStaffById(data.helper2)?.name || "-" : "-";
                        const obs = data.observation || "-";
                        return [truckId, driver, h1, h2, obs];
                    });
                };

                const departedTrucks = INITIAL_TRUCKS.filter(id => truckStatus[id] === 'departed');
                doc.setFontSize(14);
                doc.setTextColor(0, 100, 0); 
                doc.text(`Camiones EN RUTA (${departedTrucks.length})`, margin, currentY);
                currentY += 5;

                if (departedTrucks.length > 0) {
                    doc.autoTable({
                        startY: currentY,
                        head: tableHeaders,
                        body: getTableData(departedTrucks),
                        theme: 'striped',
                        headStyles: { fillColor: [46, 125, 50] },
                        styles: { fontSize: 10 }
                    });
                    currentY = doc.lastAutoTable.finalY + 10;
                }

                // NUEVO CÓDIGO PARA MOSTRAR AUSENTES EN EL PDF
                const absents = getAbsentStaff();
                if (absents.length > 0) {
                    doc.setFontSize(14);
                    doc.setTextColor(150, 0, 0); 
                    doc.text(`Personal Ausente (${absents.length})`, margin, currentY);
                    currentY += 5;

                    const absentHeaders = [["Nombre", "Rol Principal"]];
                    const absentData = absents.map(p => [
                        p.name + (p.isDriver ? " (Chofer)" : ""),
                        p.role
                    ]);

                    doc.autoTable({
                        startY: currentY,
                        head: absentHeaders,
                        body: absentData,
                        theme: 'striped',
                        headStyles: { fillColor: [183, 28, 28] },
                        styles: { fontSize: 10 }
                    });
                }

                doc.save(`logistica_reporte_${date}.pdf`);
            };

            // --- FILTRADO PARA EL BUSCADOR GENERAL ---
            const filteredTrucks = INITIAL_TRUCKS.filter(truckId => {
                if (!globalSearch) return true;
                const searchLower = globalSearch.toLowerCase();
                
                // Busca por nombre del camión
                if (truckId.toLowerCase().includes(searchLower)) return true;
                
                const data = assignments[truckId];
                if (!data) return false;
                
                // Busca por los tripulantes asignados
                const driverName = getStaffById(data.driver)?.name?.toLowerCase() || '';
                const h1Name = getStaffById(data.helper1)?.name?.toLowerCase() || '';
                const h2Name = getStaffById(data.helper2)?.name?.toLowerCase() || '';
                const obs = data.observation?.toLowerCase() || '';
                
                return driverName.includes(searchLower) || h1Name.includes(searchLower) || h2Name.includes(searchLower) || obs.includes(searchLower);
            });

            // NUEVO: FILTRADO DE PERSONAL SIN MÓVIL ASIGNADO
            const unassignedStaffMatches = globalSearch ? staff.filter(p => {
                const searchLower = globalSearch.toLowerCase();
                if (!p.name.toLowerCase().includes(searchLower) && !p.role.toLowerCase().includes(searchLower)) return false;
                
                let inTruck = false;
                Object.values(assignments).forEach(truck => {
                    if (truck && (truck.driver === p.id || truck.helper1 === p.id || truck.helper2 === p.id)) inTruck = true;
                });
                return !inTruck;
            }) : [];

            // --- PANTALLAS ---

            if (showSplash) {
                return (
                <div className="flex flex-col items-center justify-center h-screen bg-slate-900 text-white animate-fade-in">
                    <Truck size={80} className="text-blue-400 mb-4 animate-bounce" />
                    <h1 className="text-4xl font-bold tracking-widest mb-2">LOGISTICA</h1>
                    <p className="text-slate-400 text-sm">Cargando Sincronización...</p>
                </div>
                );
            }

            // PANTALLA DE ACCESO SIN CONTRASEÑA, SOLO BOTONES
            if (authStep === 'login') {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-slate-900 text-white p-4 animate-fade-in">
                        <div className="bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-slate-700">
                            <div className="flex justify-center mb-6">
                                <div className="bg-blue-500/20 p-4 rounded-full">
                                    <Users size={40} className="text-blue-400" />
                                </div>
                            </div>
                            <h2 className="text-3xl font-black text-center mb-2 tracking-wide">LOGÍSTICA</h2>
                            <p className="text-slate-400 text-center mb-8 text-sm">Selecciona tu usuario para ingresar</p>
                            
                            <div className="space-y-4">
                                <button 
                                    onClick={() => { setUserRole('admin'); setAuthStep('app'); }} 
                                    className="w-full p-4 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold transition-all flex items-center justify-between group shadow-lg shadow-blue-600/20 active:scale-95"
                                >
                                    <span className="flex items-center gap-3"><Truck size={22}/> Gustavo</span>
                                    <span className="text-xs font-black bg-blue-800/80 px-2 py-1 rounded text-blue-100">ADMINISTRADOR</span>
                                </button>
                                
                                <button 
                                    onClick={() => { setUserRole('viewer'); setAuthStep('app'); }} 
                                    className="w-full p-4 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition-all flex items-center justify-between border border-slate-600 active:scale-95"
                                >
                                    <span className="flex items-center gap-3"><Eye size={22}/> Rodrigo</span>
                                    <span className="text-xs bg-slate-800 px-2 py-1 rounded text-slate-400">ESPEJO</span>
                                </button>
                                
                                <button 
                                    onClick={() => { setUserRole('viewer'); setAuthStep('app'); }} 
                                    className="w-full p-4 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition-all flex items-center justify-between border border-slate-600 active:scale-95"
                                >
                                    <span className="flex items-center gap-3"><Eye size={22}/> Emiliano</span>
                                    <span className="text-xs bg-slate-800 px-2 py-1 rounded text-slate-400">ESPEJO</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen transition-colors duration-300 ${darkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-100 text-slate-800'}`}>
                
                <header className={`sticky top-0 z-40 backdrop-blur-md shadow-sm px-4 py-3 flex justify-between items-center ${darkMode ? 'bg-slate-900/90 border-b border-slate-800' : 'bg-white/90 border-b border-slate-200'}`}>
                    <div className="flex items-center gap-2">
                        <div className={`p-2 rounded-lg shadow-lg ${userRole === 'admin' ? 'bg-blue-600 shadow-blue-600/20' : 'bg-orange-500 shadow-orange-500/20'}`}>
                            {userRole === 'admin' ? <Truck size={20} className="text-white" /> : <Eye size={20} className="text-white" />}
                        </div>
                        <div>
                            <h1 className="font-bold leading-tight text-xl flex items-center gap-2">
                                LOGÍSTICA {userRole !== 'admin' && <span className="text-xs font-normal text-orange-500 border border-orange-500 px-1 rounded">ESPEJO</span>}
                                {userRole === 'admin' && saveStatus === 'saving' && <Loader2 size={16} className="text-slate-400 animate-spin" />}
                                {userRole === 'admin' && saveStatus === 'saved' && <Cloud size={16} className="text-green-500" />}
                            </h1>
                            <input 
                                type="date" 
                                value={date} 
                                onChange={(e) => setDate(e.target.value)}
                                className="text-sm bg-transparent outline-none text-slate-500 font-medium cursor-pointer hover:text-blue-500 transition-colors"
                            />
                        </div>
                    </div>
                    <div className="flex gap-2 items-center">
                        <button 
                            onClick={() => setCurrentView(currentView === 'dashboard' ? 'report' : 'dashboard')}
                            className={`p-2 rounded-full transition-colors ${currentView === 'report' ? 'bg-blue-100 text-blue-600 shadow-sm' : 'hover:bg-slate-200 text-slate-600 dark:text-slate-300 dark:hover:bg-slate-800'}`}
                            title="Ver Resumen"
                        >
                            {currentView === 'dashboard' ? <FileSpreadsheet size={20} /> : <Truck size={20}/>}
                        </button>

                        <button
                            onClick={() => setShowSettingsModal(true)}
                            className="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-slate-600 dark:text-slate-300"
                            title="Configuración"
                        >
                            <Settings size={20} />
                        </button>
                    </div>
                </header>

                {currentView === 'dashboard' && (
                    <main className="p-4 pb-24 max-w-6xl mx-auto">
                    
                    {/* BUSCADOR PRINCIPAL */}
                    <div className="mb-6 relative">
                        <Search className="absolute left-4 top-3.5 text-slate-400" size={20} />
                        <input 
                            type="text" 
                            placeholder="Buscar móvil o persona..." 
                            value={globalSearch}
                            onChange={(e) => setGlobalSearch(e.target.value)}
                            className={`w-full pl-12 pr-4 py-3 rounded-2xl border outline-none focus:border-blue-500 shadow-sm transition-all ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-slate-200 text-slate-800'}`}
                        />
                        {globalSearch && <button onClick={() => setGlobalSearch('')} className="absolute right-4 top-3.5 text-slate-400 hover:text-slate-600"><X size={20}/></button>}
                    </div>

                    {/* PERSONAL SIN ASIGNAR ENCONTRADO */}
                    {globalSearch && unassignedStaffMatches.length > 0 && (
                        <div className="mb-8 animate-fade-in">
                            <h3 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">Personal Encontrado (Sin Móvil)</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                {unassignedStaffMatches.map(p => (
                                    <div key={p.id} className={`p-3 rounded-xl border flex items-center justify-between ${absentStaffIds.has(p.id) ? 'bg-red-50 border-red-200 dark:bg-red-900/20 dark:border-red-800' : 'bg-blue-50 border-blue-200 dark:bg-blue-900/20 dark:border-blue-800'}`}>
                                        <div>
                                            <div className="font-bold text-slate-800 dark:text-slate-200">{p.name}</div>
                                            <div className="text-xs text-slate-500">{p.role}</div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            {absentStaffIds.has(p.id) 
                                                ? (
                                                    <>
                                                        <span className="text-[10px] font-bold text-red-600 bg-red-100 px-2 py-1 rounded shadow-sm">AUSENTE</span>
                                                        {userRole === 'admin' && (
                                                            <button onClick={() => markAsPresent(p.id)} className="p-1 text-red-400 hover:text-green-600 transition-colors font-bold text-[10px] uppercase" title="Marcar como Disponible">VOLVER</button>
                                                        )}
                                                    </>
                                                )
                                                : (
                                                    <>
                                                        <span className="text-[10px] font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded shadow-sm">DISPONIBLE</span>
                                                        {userRole === 'admin' && (
                                                            <button onClick={() => markAsAbsent(p.id)} className="p-1 text-blue-400 hover:text-red-500 transition-colors" title="Marcar como Ausente"><UserX size={16}/></button>
                                                        )}
                                                    </>
                                                )
                                            }
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        {filteredTrucks.map(truckId => {
                        const data = assignments[truckId] || {};
                        const isDeparted = truckStatus[truckId] === 'departed';
                        
                        return (
                            <div key={truckId} className={`relative rounded-xl border-2 transition-all duration-300 group/truck ${
                            isDeparted 
                                ? (darkMode ? 'bg-green-900/20 border-green-800' : 'bg-green-50 border-green-200') 
                                : (darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200 shadow-sm')
                            }`}>
                            <div className={`p-3 flex justify-between items-center border-b ${darkMode ? 'border-slate-700' : 'border-slate-100'}`}>
                                <div className="flex items-center gap-3">
                                    <span className={`text-lg font-black px-3 py-1 rounded-lg shadow-sm ${truckId.startsWith('F') ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}`}>
                                        {truckId}
                                    </span>
                                    {isDeparted && <span className="text-xs font-bold text-green-600 flex items-center gap-1 bg-green-100 px-2 py-1 rounded-full"><CheckCircle2 size={12}/> EN RUTA</span>}
                                </div>
                                <button 
                                    onClick={() => handleTruckStatusClick(truckId)}
                                    disabled={userRole !== 'admin'}
                                    className={`p-2 rounded-full transition-all ${isDeparted ? 'bg-green-500 text-white shadow-lg scale-110' : 'bg-slate-100 text-slate-400 dark:bg-slate-700'} ${userRole !== 'admin' ? 'cursor-default' : 'active:scale-95'}`}
                                >
                                    <Truck size={18} />
                                </button>
                            </div>

                            <div className="p-3 space-y-2">
                                {/* Chofer */}
                                <div onClick={() => { if(userRole === 'admin') { setSelectedSlot({ truckId, slotType: 'driver' }); setShowStaffModal(true); } }}
                                    className={`p-2 rounded-lg border-2 border-dashed transition-colors relative group
                                    ${data.driver 
                                        ? (darkMode ? 'bg-slate-700/50 border-slate-600' : 'bg-slate-50 border-slate-200') 
                                        : 'bg-red-50/50 border-red-300'
                                    } ${userRole === 'admin' ? 'cursor-pointer hover:border-blue-300' : ''}`}>
                                    <p className="text-[10px] font-bold text-slate-400 uppercase mb-1 flex items-center gap-1"><Truck size={10}/> Entregador / Chofer</p>
                                    {data.driver ? (
                                        <div className="flex justify-between items-center">
                                            <span className="font-semibold text-sm truncate">{getStaffById(data.driver)?.name}</span>
                                        </div>
                                    ) : (
                                        <span className="text-red-500 text-sm font-medium italic flex items-center gap-1"><AlertCircle size={14}/> Vacío</span>
                                    )}
                                </div>

                                {/* Ayudantes */}
                                {['helper1', 'helper2'].map(slotType => (
                                    <div key={slotType}
                                        onClick={() => { if(userRole === 'admin') { setSelectedSlot({ truckId, slotType }); setShowStaffModal(true); } }}
                                        className={`p-2 rounded-lg border-2 border-dashed transition-colors
                                        ${data[slotType]
                                            ? (darkMode ? 'bg-slate-700/50 border-slate-600' : 'bg-slate-50 border-slate-200') 
                                            : 'border-slate-200 dark:border-slate-700'
                                        } ${userRole === 'admin' ? 'cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800' : ''}`}>
                                        <p className="text-[10px] font-bold text-slate-400 uppercase mb-1 flex items-center gap-1"><Users size={10}/> {slotType === 'helper1' ? 'Ayudante 1' : 'Ayudante Volante'}</p>
                                        {data[slotType] ? (
                                            <span className="text-sm truncate">{getStaffById(data[slotType])?.name}</span>
                                        ) : (
                                            <span className="text-slate-400 text-sm italic">Vacío</span>
                                        )}
                                    </div>
                                ))}

                                {/* Observaciones */}
                                {data.observation && (
                                    <div className="mt-2 p-2 bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-800 rounded text-xs text-yellow-700 dark:text-yellow-400 italic">
                                        <span className="font-bold">Obs:</span> {data.observation}
                                    </div>
                                )}
                            </div>
                            </div>
                        );
                        })}
                        {filteredTrucks.length === 0 && unassignedStaffMatches.length === 0 && (
                            <div className="col-span-full py-12 text-center text-slate-400">
                                <Search size={48} className="mx-auto opacity-20 mb-4" />
                                <p>No se encontraron resultados para "{globalSearch}"</p>
                            </div>
                        )}
                    </div>
                    </main>
                )}

                {currentView === 'report' && (
                    <main className="p-4 max-w-4xl mx-auto pb-24">
                    <div className={`p-6 rounded-2xl shadow-xl mb-6 ${darkMode ? 'bg-slate-800' : 'bg-white'}`}>
                        <h2 className="text-3xl font-bold mb-6 flex items-center gap-3">
                            <div className="bg-blue-100 p-2 rounded-lg"><FileSpreadsheet className="text-blue-600" size={28}/></div>
                            Resumen Diario
                        </h2>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                            <div className={`p-5 rounded-2xl border-2 flex flex-col items-center justify-center gap-2 ${darkMode ? 'bg-green-900/20 border-green-800' : 'bg-green-50 border-green-100'}`}>
                                <div className="bg-green-100 p-3 rounded-full"><Truck className="text-green-600" size={24}/></div>
                                <div className="text-4xl font-black text-green-600">
                                    {Object.values(truckStatus).filter(s => s === 'departed').length}
                                </div>
                                <div className="font-bold text-green-700">Camiones en Ruta</div>
                            </div>
                            <div className={`p-5 rounded-2xl border-2 flex flex-col items-center justify-center gap-2 ${darkMode ? 'bg-slate-700 border-slate-600' : 'bg-slate-50 border-slate-100'}`}>
                                <div className="bg-slate-200 p-3 rounded-full dark:bg-slate-600"><Users className="text-slate-600 dark:text-slate-300" size={24}/></div>
                                <div className="text-4xl font-black text-slate-600 dark:text-slate-300">
                                    {getCompletelyFreeStaff().length}
                                </div>
                                <div className="font-bold text-slate-600 dark:text-slate-400">Personal Disponible</div>
                            </div>
                            <div className={`p-5 rounded-2xl border-2 flex flex-col items-center justify-center gap-2 ${darkMode ? 'bg-red-900/20 border-red-800' : 'bg-red-50 border-red-100'}`}>
                                <div className="bg-red-100 p-3 rounded-full"><UserX className="text-red-600" size={24}/></div>
                                <div className="text-4xl font-black text-red-600">
                                    {getAbsentStaff().length}
                                </div>
                                <div className="font-bold text-red-700">Personal Ausente</div>
                            </div>
                        </div>

                        <div className="grid md:grid-cols-2 gap-8">
                            <div>
                                <h3 className="font-bold text-xl mb-4 flex items-center gap-2 text-slate-700 dark:text-slate-300"><Users size={20}/> Disponibles para Asignar</h3>
                                <ul className={`space-y-2 max-h-[300px] overflow-y-auto p-2 rounded-xl border ${darkMode ? 'border-slate-700 bg-slate-900/30' : 'border-slate-100 bg-slate-50'}`}>
                                    {getCompletelyFreeStaff().map(p => (
                                        <li key={p.id} className="flex items-center justify-between p-2 rounded bg-white dark:bg-slate-700 shadow-sm border border-slate-100 dark:border-slate-600">
                                            <div className="flex items-center gap-3">
                                                <div className={`w-3 h-3 rounded-full ${p.isDriver ? 'bg-red-500 shadow-sm shadow-red-500/50' : 'bg-slate-300'}`}></div>
                                                <div>
                                                    <span className={`font-bold block ${p.isDriver ? 'text-red-600 dark:text-red-400' : ''}`}>{p.name}</span>
                                                    <span className="text-xs opacity-60">({p.role})</span>
                                                </div>
                                            </div>
                                            {userRole === 'admin' && (
                                                <button onClick={() => markAsAbsent(p.id)} className="p-1 text-slate-300 hover:text-red-500 transition-colors" title="Marcar como Ausente"><UserX size={16}/></button>
                                            )}
                                        </li>
                                    ))}
                                    {getCompletelyFreeStaff().length === 0 && <p className="text-sm text-slate-400 p-2 text-center">Nadie disponible</p>}
                                </ul>
                            </div>

                            <div>
                                <h3 className="font-bold text-xl mb-4 flex items-center gap-2 text-red-600 dark:text-red-400"><UserX size={20}/> Ausentes Hoy</h3>
                                <ul className={`space-y-2 max-h-[300px] overflow-y-auto p-2 rounded-xl border ${darkMode ? 'border-red-900/30 bg-red-900/10' : 'border-red-100 bg-red-50'}`}>
                                    {getAbsentStaff().map(p => (
                                        <li key={p.id} className="flex items-center justify-between p-2 rounded bg-white dark:bg-slate-700 shadow-sm border border-red-100 dark:border-red-900/30">
                                            <div className="flex items-center gap-3">
                                                <UserX size={16} className="text-red-500"/>
                                                <span className="font-bold text-slate-800 dark:text-slate-200">{p.name}</span>
                                            </div>
                                            {userRole === 'admin' && (
                                                <button onClick={() => markAsPresent(p.id)} className="p-1 text-red-300 hover:text-green-500 transition-colors font-bold text-xs" title="Marcar como Presente">VOLVER</button>
                                            )}
                                        </li>
                                    ))}
                                    {getAbsentStaff().length === 0 && <p className="text-sm text-slate-400 p-2 text-center">Nadie marcado como ausente</p>}
                                </ul>
                            </div>
                        </div>
                        
                        <div className="mt-8 pt-6 border-t dark:border-slate-700">
                            <button 
                                onClick={exportPDF}
                                className="w-full py-4 bg-red-600 hover:bg-red-700 text-white rounded-2xl font-black text-lg shadow-xl flex items-center justify-center gap-3 transition-all"
                            >
                                <FileText size={28}/>
                                Descargar Reporte en PDF
                            </button>
                        </div>
                    </div>
                    </main>
                )}

                <DispatchModal 
                    isOpen={dispatchModal.isOpen}
                    onClose={() => setDispatchModal({ isOpen: false, truckId: null, observation: '' })}
                    onConfirm={confirmDispatch}
                    truckId={dispatchModal.truckId}
                    initialObservation={dispatchModal.observation}
                    darkMode={darkMode}
                />

                <StaffSelectorModal 
                    isOpen={showStaffModal} 
                    onClose={() => setShowStaffModal(false)}
                    staffList={getNonAbsentStaff()}
                    assignments={assignments}
                    onAssign={handleAssign}
                    onMarkAbsent={handleMarkCurrentSlotAbsent}
                    darkMode={darkMode}
                    isAdmin={userRole === 'admin'}
                />

                <ManageStaffModal 
                    isOpen={showManageStaffModal}
                    onClose={() => setShowManageStaffModal(false)}
                    staff={staff}
                    onAdd={handleAddStaff}
                    onDelete={handleDeleteStaff}
                    onToggleDriver={toggleDriverStatus}
                    newStaffData={newStaffData}
                    setNewStaffData={setNewStaffData}
                    darkMode={darkMode}
                    isAdmin={userRole === 'admin'}
                />

                <SettingsModal 
                    isOpen={showSettingsModal}
                    onClose={() => setShowSettingsModal(false)}
                    darkMode={darkMode}
                    toggleTheme={() => setDarkMode(!darkMode)}
                    onOpenManageStaff={() => setShowManageStaffModal(true)}
                    onResetDay={handleResetDay}
                    isAdmin={userRole === 'admin'}
                />

                <div className="fixed bottom-6 right-6 lg:hidden z-50">
                    <button 
                        onClick={() => setCurrentView(currentView === 'dashboard' ? 'report' : 'dashboard')}
                        className={`w-14 h-14 text-white rounded-full shadow-2xl flex items-center justify-center border-4 border-white dark:border-slate-800
                            ${currentView === 'dashboard' ? 'bg-green-600' : 'bg-blue-600'}
                        `}
                    >
                        {currentView === 'dashboard' ? <ClipboardCheck size={24} /> : <Truck size={24} />}
                    </button>
                </div>

                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
